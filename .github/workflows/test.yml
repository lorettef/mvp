name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-min-32-chars-long!!
          GIGACHAT_AUTH_KEY: test-key
          GIGACHAT_CLIENT_ID: test-client
          DEMO_MODE: true
        run: |
          cd backend
          pytest --cov=app --cov-report=xml

      - name: Verify migrations (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-min-32-chars-long!!
        run: |
          cd backend
          alembic upgrade head
          alembic current
          alembic downgrade base

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run tests
        run: |
          cd frontend
          npm run test -- --run
      
      - name: Build
        run: |
          cd frontend
          npm run build
